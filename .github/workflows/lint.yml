name: lint

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/lint.yml'
  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Go from the feed (golang/go master tip)
        uses: Capricornus007/repo/.github/actions/setup-feed-go@master
      - name: Cache go module
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
          key: go-${{ hashFiles('**/go.sum') }}
      # 不能用 golangci-lint-action / go install：它釘 x/tools v0.50.0，讀不了 go tip 的
      # std export data（實測 v0.50 ✗、v0.51 ✓、v0.52 ✓）→ Lint 必紅。換依賴重 build
      # 的步驟與交叉表在 feed 倉 .github/actions/setup-gcl。
      # 版本照舊釘 v2.13.2（理由見上），但依賴裡的 x/tools 要抬到讀得懂 go tip 的那顆，
      # 兩件事互不衝突：setup-gcl 的 version 管 golangci-lint 本體、xtools 管它的依賴。
      - name: Install golangci-lint v2.13.2 (with x/tools that reads Go tip)
        uses: Capricornus007/repo/.github/actions/setup-gcl@master
        with:
          version: v2.13.2
      - name: golangci-lint
        run: golangci-lint run .
