name: lint

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/lint.yml'
  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Go from the feed (golang/go master tip)
        uses: Capricornus007/repo/.github/actions/setup-feed-go@master
      - name: Cache go module
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
          key: go-${{ hashFiles('**/go.sum') }}
      # 不能用 golangci-lint-action / go install：它釘 x/tools v0.50.0，讀不了 go tip 的
      # std export data（實測 v0.50 ✗、v0.51 ✓、v0.52 ✓）→ Lint 必紅。換依賴重 build
      # 的步驟與交叉表在 feed 倉 .github/actions/setup-gcl。
      # 用最新 release（用戶 2026-10-11 裁：工具也一律最尖端）。
      # 舊註解寫「必須與本機同號 v2.13.2，否則新版把同一條 finding 記到不同行、
      # 行內 //nolint 看起來失效」——這個前提不再當理由：真出現行號漂移就去改代碼裡
      # nolint 的位置，不靠降版迴避。x/tools 由 setup-gcl 抬到讀得懂 go tip 的那顆。
      - name: Install golangci-lint v2.15.0 (with x/tools that reads Go tip)
        uses: Capricornus007/repo/.github/actions/setup-gcl@master
        with:
          version: v2.15.0
          xtools: v0.52.0
      - name: golangci-lint
        run: golangci-lint run .
