version: "2"

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - paralleltest
    - ineffassign

formatters:
  enable:
    - gofumpt
    - gci
  settings:
    gci:
      custom-order: true
      sections:
        - standard
        - prefix(github.com/sagernet/)
        - default

run:
  go: "1.23"
